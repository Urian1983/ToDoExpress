<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Editar tarea · ToDoExpress' : 'Nueva tarea · ToDoExpress'">Tarea</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="page-header">
        <h1 th:text="${isEdit} ? 'Editar tarea' : 'Nueva tarea'">Tarea</h1>
    </div>

    <!--
      th:object="${taskForm}" define sobre qué objeto del Model actúan los campos.
      th:action decide a qué URL se envía el formulario según si estamos creando o editando:
      esto es el patrón PRG (Post/Redirect/Get) para evitar reenvíos duplicados al recargar.
    -->
    <form class="card-form"
          th:object="${taskForm}"
          th:action="${isEdit} ? @{/tasks/{id}/update(id=${taskForm.id})} : @{/tasks}"
          method="post">

        <div class="field">
            <label for="description">Descripción</label>
            <input type="text" id="description" th:field="*{description}" placeholder="¿Qué hay que hacer?">
            <!-- th:errors muestra el mensaje de la anotación @NotBlank si la validación falla -->
            <div class="error-text" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="field">
            <label for="priority">Prioridad</label>
            <select id="priority" th:field="*{priority}">
                <option value="">-- Selecciona --</option>
                <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
            </select>
            <div class="error-text" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></div>
        </div>

        <div class="field">
            <label for="status">Estado</label>
            <select id="status" th:field="*{status}">
                <option value="">-- Selecciona --</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
            </select>
            <div class="error-text" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/tasks}">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
