<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Auditoría · ToDoExpress</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="page-header">
        <h1>Auditoría</h1>
        <a class="btn btn-primary" th:href="@{/audits/new}">+ Nuevo registro</a>
    </div>

    <div class="card">
        <div class="empty-state" th:if="${audits.isEmpty()}">
            No hay registros de auditoría todavía.
        </div>

        <table th:unless="${audits.isEmpty()}">
            <thead>
            <tr>
                <th>#</th>
                <th>Nivel</th>
                <th>Tarea</th>
                <th>Mensaje</th>
                <th>Fecha</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="audit : ${audits}">
                <td th:text="${audit.id()}">1</td>
                <td>
                    <span class="badge" th:classappend="'badge-' + ${audit.level()}" th:text="${audit.level()}">INFO</span>
                </td>
                <td th:text="${audit.taskId()}">10</td>
                <td th:text="${audit.message()}">Mensaje</td>
                <td th:text="${#temporals.format(audit.createdAt(), 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
